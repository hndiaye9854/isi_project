global:
  scrape_interval: 10s
scrape_configs:
  - job_name: surfwear
    metrics_path: /metrics
    static_configs:
      - targets:
          - gateway:8080
          - catalogue:8081
          - commandes:8082
          - notifications:8083
          - analytics:8084
          - erp-connector:8085
          - erp-mock:8090
