# Écosystème complet : plateforme d'interopérabilité, ERP simulé et boutiques simulées.
# Démarrage : docker compose up -d --build   (ou : podman compose up -d --build)

name: surfwear

x-node-service: &node-service
  restart: unless-stopped
  build:
    context: .
    dockerfile: Dockerfile
  environment: &common-env
    LOG_LEVEL: ${LOG_LEVEL:-info}
    RABBITMQ_URL: amqp://${RABBITMQ_USER:-surfwear}:${RABBITMQ_PASSWORD:-surfwear}@rabbitmq:5672
    REDIS_URL: redis://redis:6379
  depends_on: &infra-ready
    postgres: { condition: service_healthy }
    rabbitmq: { condition: service_healthy }
    redis: { condition: service_healthy }
  networks: [plateforme]

x-auth-env: &auth-env
  AUTH_MODE: ${AUTH_MODE:-dev}
  AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
  AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-}
  MCP_AUDIENCE: ${MCP_AUDIENCE:-https://mcp.surfwear.example}

services:
  # ---------------- Infrastructure ----------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-surfwear}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [plateforme, entreprise]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [plateforme]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-surfwear}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-surfwear}
    ports: ["15672:15672"]   # console d'administration du bus
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20
    networks: [plateforme]

  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports: ["8025:8025"]     # boîte mail de test : http://localhost:8025
    networks: [plateforme]

  # ---------------- SI de l'entreprise (simulé) ----------------
  erp-mock:
    <<: *node-service
    build: { context: ., dockerfile: Dockerfile, args: { SERVICE_PATH: services/erp-mock } }
    image: surfwear/erp-mock:1.0.0
    environment:
      <<: *common-env
      PORT: 8090
      ERP_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-surfwear}@postgres:5432/erp
      TRACES: "off"            # réseau isolé : pas d'accès au bus (ses échanges sont tracés par le connecteur)
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["8090:8090"]     # poste logisticien : http://localhost:8090/logistique/
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://localhost:8090/health"], interval: 10s, timeout: 3s, retries: 10 }
    networks: [entreprise]

  # ---------------- Plateforme d'interopérabilité ----------------
  erp-connector:
    <<: *node-service
    build: { context: ., dockerfile: Dockerfile, args: { SERVICE_PATH: services/erp-connector } }
    image: surfwear/erp-connector:1.0.0
    environment:
      <<: *common-env
      PORT: 8085
      ERP_URL: http://erp-mock:8090
    depends_on:
      <<: *infra-ready
      erp-mock: { condition: service_healthy }
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://localhost:8085/health"], interval: 10s, timeout: 3s, retries: 10 }
    networks: [plateforme, entreprise]   # seul service relié au réseau de l'entreprise

  catalogue:
    <<: *node-service
    build: { context: ., dockerfile: Dockerfile, args: { SERVICE_PATH: services/catalogue } }
    image: surfwear/catalogue:1.0.0
    environment:
      <<: *common-env
      PORT: 8081
      ERP_CONNECTOR_URL: http://erp-connector:8085
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"], interval: 10s, timeout: 3s, retries: 10 }

  commandes:
    <<: *node-service
    build: { context: ., dockerfile: Dockerfile, args: { SERVICE_PATH: services/commandes } }
    image: surfwear/commandes:1.0.0
    environment:
      <<: *common-env
      PORT: 8082
      ERP_CONNECTOR_URL: http://erp-connector:8085
      COMMANDES_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-surfwear}@postgres:5432/commandes
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://localhost:8082/health"], interval: 10s, timeout: 3s, retries: 10 }

  notifications:
    <<: *node-service
    build: { context: ., dockerfile: Dockerfile, args: { SERVICE_PATH: services/notifications } }
    image: surfwear/notifications:1.0.0
    environment:
      <<: *common-env
      PORT: 8083
      NOTIFICATIONS_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-surfwear}@postgres:5432/notifications
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      BOUTIQUE_EMAILS: B001:biarritz@boutiques.test,B002:hossegor@boutiques.test,B003:lacanau@boutiques.test
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://localhost:8083/health"], interval: 10s, timeout: 3s, retries: 10 }
    networks: [plateforme, boutiques]    # appelle les webhooks des boutiques

  analytics:
    <<: *node-service
    build: { context: ., dockerfile: Dockerfile, args: { SERVICE_PATH: services/analytics } }
    image: surfwear/analytics:1.0.0
    environment:
      <<: *common-env
      PORT: 8084
      ANALYTICS_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-surfwear}@postgres:5432/analytics
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://localhost:8084/health"], interval: 10s, timeout: 3s, retries: 10 }

  # Serveur MCP (assistants IA), derrière la passerelle : http://localhost:8080/mcp
  mcp:
    <<: *node-service
    build: { context: ., dockerfile: Dockerfile, args: { SERVICE_PATH: services/mcp } }
    image: surfwear/mcp:1.0.0
    environment:
      <<: [*common-env, *auth-env]
      PORT: 8086
      MCP_RESOURCE: ${MCP_RESOURCE:-http://localhost:8080/mcp}
    depends_on:
      <<: *infra-ready
      catalogue: { condition: service_healthy }
      commandes: { condition: service_healthy }
      analytics: { condition: service_healthy }
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://localhost:8086/health"], interval: 10s, timeout: 3s, retries: 10 }

  # Passerelle d'API : KrakenD CE. Routes et permissions dans infra/krakend/settings/routes.json.
  gateway:
    restart: unless-stopped
    build: { context: infra/krakend }
    image: surfwear/gateway:2.0.0
    environment:
      <<: *auth-env
    depends_on:
      catalogue: { condition: service_healthy }
      commandes: { condition: service_healthy }
      notifications: { condition: service_healthy }
      analytics: { condition: service_healthy }
      mcp: { condition: service_healthy }
      mock-oauth2: { condition: service_started }
    ports: ["8080:8080"]     # API publique : http://localhost:8080/api/v1/...
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://localhost:8080/__health"], interval: 10s, timeout: 3s, retries: 10 }
    networks: [plateforme, boutiques]

  # Documentation interactive de l'API (Swagger UI), qui appelle la passerelle.
  swagger-ui:
    image: swaggerapi/swagger-ui:v5.17.14
    restart: unless-stopped
    environment:
      SWAGGER_JSON: /openapi/openapi.yaml
      DOC_EXPANSION: list
    volumes: [./docs/openapi.yaml:/openapi/openapi.yaml:ro]
    ports: ["8088:8080"]     # http://localhost:8088
    networks: [boutiques]

  # Faux fournisseur OAuth2 (AUTH_MODE=dev et CI) : délivre de vrais JWT signés, comme Auth0, sans compte.
  mock-oauth2:
    image: ghcr.io/navikt/mock-oauth2-server:6.0.8
    restart: unless-stopped
    environment:
      JSON_CONFIG_PATH: /config/config.json
    volumes: [./infra/mock-oauth2/config.json:/config/config.json:ro]
    ports: ["8099:8080"]     # jetons de test : bash scripts/jeton.sh B001
    networks: [plateforme, boutiques]

  # ---------------- Boutiques clientes (simulées) ----------------
  boutique-biarritz: &boutique
    restart: unless-stopped
    build: { context: ., dockerfile: Dockerfile, args: { SERVICE_PATH: simulators/boutique } }
    image: surfwear/boutique-simulator:1.0.0
    environment:
      <<: *auth-env
      PORT: 7000
      GATEWAY_URL: http://gateway:8080
      BOUTIQUE_ID: B001
      BOUTIQUE_NOM: Surf Shop Biarritz
      PUBLIC_URL: http://boutique-biarritz:7000
      AUTH0_CLIENT_ID: ${AUTH0_B001_CLIENT_ID:-}
      AUTH0_CLIENT_SECRET: ${AUTH0_B001_CLIENT_SECRET:-}
    depends_on:
      gateway: { condition: service_healthy }
    ports: ["7001:7000"]
    networks: [boutiques]

  boutique-hossegor:
    <<: *boutique
    environment:
      <<: *auth-env
      PORT: 7000
      GATEWAY_URL: http://gateway:8080
      BOUTIQUE_ID: B002
      BOUTIQUE_NOM: Surf Shop Hossegor
      PUBLIC_URL: http://boutique-hossegor:7000
      AUTH0_CLIENT_ID: ${AUTH0_B002_CLIENT_ID:-}
      AUTH0_CLIENT_SECRET: ${AUTH0_B002_CLIENT_SECRET:-}
    ports: ["7002:7000"]

  boutique-lacanau:
    <<: *boutique
    environment:
      <<: *auth-env
      PORT: 7000
      GATEWAY_URL: http://gateway:8080
      BOUTIQUE_ID: B003
      BOUTIQUE_NOM: Surf Shop Lacanau
      PUBLIC_URL: http://boutique-lacanau:7000
      AUTH0_CLIENT_ID: ${AUTH0_B003_CLIENT_ID:-}
      AUTH0_CLIENT_SECRET: ${AUTH0_B003_CLIENT_SECRET:-}
    ports: ["7003:7000"]

  # ---------------- Démo animée des flux (optionnelle) ----------------
  # docker compose --profile demo up -d --build   puis   http://localhost:8070
  # Relié aux trois réseaux pour piloter les boutiques et l'ERP : outil de démonstration, jamais en production.
  observatoire:
    <<: *node-service
    profiles: [demo]
    build: { context: ., dockerfile: Dockerfile, args: { SERVICE_PATH: services/observatoire } }
    image: surfwear/observatoire:1.0.0
    environment:
      <<: *common-env
      PORT: 8070
      ERP_URL: http://erp-mock:8090
    depends_on:
      <<: *infra-ready
      gateway: { condition: service_healthy }
    ports: ["8070:8070"]
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://localhost:8070/health"], interval: 10s, timeout: 3s, retries: 10 }
    networks: [plateforme, boutiques, entreprise]

  # ---------------- Supervision (optionnelle) ----------------
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [monitoring]
    volumes: [./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["9090:9090"]
    networks: [plateforme, entreprise]

  grafana:
    image: grafana/grafana:11.3.1
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: surfwear
    volumes: [./infra/grafana/provisioning:/etc/grafana/provisioning:ro]
    ports: ["3000:3000"]
    networks: [plateforme]

networks:
  plateforme: {}   # services de la plateforme
  entreprise: {}   # réseau interne de l'entreprise (ERP)
  boutiques: {}    # "Internet" côté boutiques

volumes:
  postgres-data: {}
  redis-data: {}
  rabbitmq-data: {}
